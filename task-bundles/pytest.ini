# Run per bundle, from its directory, with ray_core and the bundle on the path (what .github/workflows/task-bundles.yml does):
#   cd tasks/<slug> && PYTHONPATH=.:<core-backend>/ray-training <ray-training venv>/bin/python -m pytest tests
[pytest]
addopts = --import-mode=importlib -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::torch.jit.TracerWarning
markers =
    online: needs a Hugging Face download; skipped when offline
