name: Ray image (reusable)

# Shared by ray-jobs-image.yml and ray-training-image.yml: build the image, smoke-test it, push it, then open a PR in
# drills-pro/k8s that pins the new digest in apps/ray/app/raycluster.yaml. The PR is never merged from here: merging it
# restarts the Ray head and the workers, so a person does that.
#
# Order matters: the image is built into the local Docker daemon (load: true), scripts/ray-image-smoke.py runs inside it, and
# only then does a second build-push-action push it (every layer comes from the first build's cache, so it is not rebuilt).
on:
  workflow_call:
    inputs:
      name:
        description: "Image name under ghcr.io/<repo>/ and the build context dir (ray-jobs | ray-training)"
        required: true
        type: string
      free-disk:
        description: "Delete preinstalled toolchains first (torch + CUDA need more than the runner's free space)"
        type: boolean
        default: false
      smoke-args:
        description: "Arguments of scripts/ray-image-smoke.py"
        required: true
        type: string
    secrets:
      k8s-token:
        description: "PAT with contents:write and pull-requests:write on drills-pro/k8s (K8S_REPO_PAT)"
        required: false

env:
  REGISTRY: ghcr.io
  SMOKE_TAG: ray-image-smoke:local

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        if: inputs.free-disk
        # The build loads the image into the local daemon (to test it), so the runner holds the base image, the layers and the exported
        # image at once: about three times the 17 GB cu128 image. The preinstalled toolchains and preloaded Docker images are what gives
        # that room back (the list is the one in https://mathio28.medium.com/squeezing-disk-space-from-github-actions-runners-an-engineers-guide-d5fbe4443692).
        run: |
          sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc /usr/local/julia* \
            /usr/local/lib/android /usr/local/share/chromium /usr/local/share/powershell /usr/local/share/boost \
            /opt/microsoft /opt/google /opt/az /opt/hostedtoolcache
          docker system prune --all --force > /dev/null
          docker builder prune --all --force > /dev/null
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build (into the local daemon, nothing is pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.name }}
          load: true
          tags: ${{ env.SMOKE_TAG }}
          cache-from: type=gha,scope=${{ inputs.name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.name }}
      - name: Smoke test the image
        # The repo is mounted read-only, so the packages on PYTHONPATH are this commit's source, not a zip. No network, no S3.
        # --shm-size: Ray's object store lives in /dev/shm. The runner has no GPU, so the GPU image runs its CPU path.
        run: |
          docker run --rm --shm-size=2g \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/src/ray-jobs:/src/ray-serving:/src/ray-training \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            --entrypoint python "$SMOKE_TAG" \
            /src/scripts/ray-image-smoke.py ${{ inputs.smoke-args }}
      - name: Push (the image that passed, not a second build of it)
        id: push
        if: github.event_name != 'pull_request'
        run: |
          ref="${REGISTRY}/${GITHUB_REPOSITORY}/${{ inputs.name }}:${{ steps.sha.outputs.tag }}"
          docker tag "$SMOKE_TAG" "$ref"
          docker push "$ref" | tee push.log
          digest="$(grep -oE 'digest: sha256:[0-9a-f]{64}' push.log | tail -1 | cut -d' ' -f2)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest in the push output"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # A pull request in drills-pro/k8s, not a push: the pin restarts the Ray head and the GPU worker, so it is reviewed and
  # merged by hand. One branch per image, force-pushed, so a newer build updates the open PR instead of opening another.
  bump-k8s:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: bump-k8s-${{ inputs.name }}
    permissions: {}
    env:
      GH_TOKEN: ${{ secrets.k8s-token }}
      K8S_REPO: drills-pro/k8s
      PIN_FILE: apps/ray/app/raycluster.yaml
      IMAGE: ghcr.io/${{ github.repository }}/${{ inputs.name }}
      DIGEST: ${{ needs.build.outputs.digest }}
      BRANCH: bump/${{ inputs.name }}
      NAME: ${{ inputs.name }}
    steps:
      - name: Open or update the k8s pull request
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest: '$DIGEST'"; exit 1; }
          [ -n "$GH_TOKEN" ] || { echo "secret K8S_REPO_PAT is not set"; exit 1; }
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${K8S_REPO}.git" k8s
          cd k8s
          git checkout -b "$BRANCH"
          sed -i -E "s#(image: ${IMAGE}@)sha256:[0-9a-f]{64}#\1${DIGEST}#" "$PIN_FILE"
          grep -q "${IMAGE}@${DIGEST}" "$PIN_FILE" || { echo "no '${IMAGE}@sha256:...' line in $PIN_FILE"; exit 1; }
          if git diff --quiet; then echo "$PIN_FILE already pins $DIGEST"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(ray): pin ${NAME} image ${DIGEST:0:19}"
          git push --force origin "$BRANCH"
          body="Pins \`${IMAGE}@${DIGEST}\`, built and smoke-tested by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (commit ${GITHUB_SHA::7}). Merging restarts the Ray head and workers."
          if [ -n "$(gh pr list --repo "$K8S_REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr edit "$BRANCH" --repo "$K8S_REPO" --body "$body"
          else
            gh pr create --repo "$K8S_REPO" --base main --head "$BRANCH" --title "chore(ray): pin ${NAME} image" --body "$body"
          fi
