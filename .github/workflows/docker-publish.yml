name: Build and Push Docker Images

on:
  push:
    paths:
      - "core-api/**"
      - "ray-jobs/**"
      - "compose/postgres/**"
      - "docker-compose.yml"
      - "scripts/lint-migrations.py"
      - "scripts/migrations-check.sh"
  pull_request:  # only the migrations job runs on a pull request: the tests have their own workflow (tests.yml)
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      core-api: ${{ steps.filter.outputs.core-api }}
      tag: ${{ steps.sha.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core-api:
              - 'core-api/**'
              - 'ray-jobs/**'
      - id: sha
        run: |
          if [ "${GITHUB_REF#refs/heads/}" = "main" ]; then
            echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  # The image ships /migrations and the cluster applies them before rolling out (backend-migrate Job),
  # so a migration that fails here must not become an image.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/lint-migrations.py core-api/migrations/*.sql
      - run: ./scripts/migrations-check.sh

  # The suites a pull request has to pass (tests.yml), so a red test cannot become an image. Not on a pull request:
  # tests.yml already runs there.
  tests:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/tests.yml

  build-core-api:
    needs: [changes, migrations, tests]
    # Never from a pull request: this job pushes to GHCR.
    if: github.event_name != 'pull_request' && (needs.changes.outputs.core-api == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./core-api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/core-api:${{ needs.changes.outputs.tag }}
          cache-from: type=gha,scope=core-api
          cache-to: type=gha,mode=max,scope=core-api

  deploy-core-api:
    needs: [changes, build-core-api]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: drills-pro/k8s/.github/workflows/bump-image.yml@main
    with:
      app: backend
      image: ghcr.io/drills-pro/core-backend/core-api
      digest: ${{ needs.build-core-api.outputs.digest }}
      tag: ${{ needs.changes.outputs.tag }}
    secrets:
      repo-token: ${{ secrets.K8S_REPO_PAT }}
