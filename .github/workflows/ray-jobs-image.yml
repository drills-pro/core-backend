name: Build the Ray jobs image

# The cluster's CPU Ray image plus the ray_jobs dependencies (ray-jobs/Dockerfile). Built, smoke-tested inside the image
# (scripts/ray-image-smoke.py), pushed, and then pinned by a pull request in drills-pro/k8s (see ray-image.yml). A pull
# request only builds and tests. The k8s PR is not merged from here: merging it restarts the Ray head and the workers.
on:
  push:
    paths:
      - "ray-jobs/Dockerfile"
      - "ray-jobs/pyproject.toml"
      - ".github/workflows/ray-jobs-image.yml"
      - ".github/workflows/ray-image.yml"
      - "scripts/ray-image-smoke.py"
  pull_request:
    paths:
      - "ray-jobs/**"
      - "ray-serving/**"
      - "ray-training/ray_core/**"
      - "ray-common/ray_common/**"
      - ".github/workflows/ray-jobs-image.yml"
      - ".github/workflows/ray-image.yml"
      - "scripts/ray-image-smoke.py"
  workflow_dispatch:

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ray-image.yml
    with:
      name: ray-jobs
      # This group runs the ingest jobs, Ray Serve (predictor-cpu) and the training *driver*, which never loads the trainers
      # (so no transformers here): it imports the driver and the smoke entrypoint, not every ray_core module or any task bundle.
      smoke-args: >-
        --imports onnx onnxruntime torch ray.serve ray.train.torch boto3 pyarrow PIL tokenizers
        --packages ray_jobs ray_serving
        --modules ray_core.entrypoints.train ray_core.entrypoints.smoke
        --serving-check
    secrets:
      k8s-token: ${{ secrets.K8S_REPO_PAT }}
