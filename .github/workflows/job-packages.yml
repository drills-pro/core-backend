name: Publish the Ray job packages

# Builds ray_jobs, ray_training (ray-training/ray_core, the contract task bundles run on) and ray_serving (the code the Ray cluster hot-loads, see core-api job_package.py), copies each zip to
# the staging bucket as jobs/<ray-jobs|ray-training|ray-serving>-<sha256>.zip, then makes the call that targets it: core-api reads the object back, checks its
# hash and contents, smokes it, and makes it the package's target once the smoke passed (POST /v1/admin/job-packages/{name}/target). No admin step is involved.
#
# A rollback is a manual run (workflow_dispatch, action rollback): the same call for an earlier version that is already registered and passed its smoke.
#
# Needs, in the repo's settings:
#   vars.STAGING_BUCKET        the staging bucket (data_plane.staging_bucket in core-api prod.yaml)
#   vars.GCP_WORKLOAD_IDENTITY_PROVIDER, vars.GCP_SERVICE_ACCOUNT
#                              a service account that may create objects under jobs/ in that bucket, trusted from this repo
#   vars.CORE_API_URL          base URL of core-api, e.g. https://api.drills.pro
#   vars.ZITADEL_ISSUER        the issuer in core-api config (https://auth.drills.pro)
#   vars.ZITADEL_PROJECT_ID    the project core-api verifies tokens for (token audience)
#   secrets.ZITADEL_CLIENT_ID / ZITADEL_CLIENT_SECRET   a machine user with the platform_admin role, access token type JWT
on:
  push:
    branches: [main]
    paths:
      - "ray-jobs/ray_jobs/**"
      - "ray-training/ray_core/**"
      - "ray-serving/ray_serving/**"
      - "ray-common/ray_common/**"
      - "scripts/build-job-package.py"
      - ".github/workflows/job-packages.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "publish: build this commit's packages and target them. rollback: target an earlier version of one package"
        type: choice
        options: [publish, rollback]
        default: publish
      package:
        description: "rollback: the package"
        type: choice
        options: [ray_jobs, ray_training, ray_serving]
        default: ray_jobs
      sha256:
        description: "rollback: the version to target. It must be registered already, with its smoke passed"
        type: string
        default: ""

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for the Google workload identity federation below
    steps:
      - uses: actions/checkout@v4
      - name: Build the packages
        id: build
        run: |
          for name in ray_jobs ray_training ray_serving; do
            echo "${name}=$(python3 scripts/build-job-package.py "$name" dist)" >> "$GITHUB_OUTPUT"
          done
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Copy the zips to the staging bucket
        env:
          BUCKET: ${{ vars.STAGING_BUCKET }}
          RAY_JOBS: ${{ steps.build.outputs.ray_jobs }}
          RAY_TRAINING: ${{ steps.build.outputs.ray_training }}
          RAY_SERVING: ${{ steps.build.outputs.ray_serving }}
        run: |
          gcloud storage cp dist/ray_jobs.zip "gs://${BUCKET}/jobs/ray-jobs-${RAY_JOBS}.zip"
          gcloud storage cp dist/ray_training.zip "gs://${BUCKET}/jobs/ray-training-${RAY_TRAINING}.zip"
          gcloud storage cp dist/ray_serving.zip "gs://${BUCKET}/jobs/ray-serving-${RAY_SERVING}.zip"
      - name: Get a platform_admin token
        id: token
        env:
          ISSUER: ${{ vars.ZITADEL_ISSUER }}
          PROJECT_ID: ${{ vars.ZITADEL_PROJECT_ID }}
          CLIENT_ID: ${{ secrets.ZITADEL_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.ZITADEL_CLIENT_SECRET }}
        run: |
          token=$(curl -fsS -u "${CLIENT_ID}:${CLIENT_SECRET}" "${ISSUER}/oauth/v2/token" \
            -d grant_type=client_credentials \
            --data-urlencode "scope=openid urn:zitadel:iam:org:project:id:${PROJECT_ID}:aud urn:zitadel:iam:org:projects:roles" \
            | jq -er .access_token)
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"
      - name: Target the new versions
        env:
          API: ${{ vars.CORE_API_URL }}
          TOKEN: ${{ steps.token.outputs.token }}
          RAY_JOBS: ${{ steps.build.outputs.ray_jobs }}
          RAY_TRAINING: ${{ steps.build.outputs.ray_training }}
          RAY_SERVING: ${{ steps.build.outputs.ray_serving }}
        run: |
          target() {  # name key: core-api reads the object back and checks it against the sha256 in the key
            curl -fsS -X POST "${API}/v1/admin/job-packages/$1/target" \
              -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
              -d "{\"s3_key\": \"$2\"}" | jq -c '{name, sha256, status, smoke_status}'
          }
          target ray_jobs "jobs/ray-jobs-${RAY_JOBS}.zip"
          target ray_training "jobs/ray-training-${RAY_TRAINING}.zip"
          target ray_serving "jobs/ray-serving-${RAY_SERVING}.zip"

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        env:
          SHA256: ${{ inputs.sha256 }}
        run: |
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::sha256 must be 64 lowercase hex characters"; exit 1; }
      - name: Get a platform_admin token
        id: token
        env:
          ISSUER: ${{ vars.ZITADEL_ISSUER }}
          PROJECT_ID: ${{ vars.ZITADEL_PROJECT_ID }}
          CLIENT_ID: ${{ secrets.ZITADEL_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.ZITADEL_CLIENT_SECRET }}
        run: |
          token=$(curl -fsS -u "${CLIENT_ID}:${CLIENT_SECRET}" "${ISSUER}/oauth/v2/token" \
            -d grant_type=client_credentials \
            --data-urlencode "scope=openid urn:zitadel:iam:org:project:id:${PROJECT_ID}:aud urn:zitadel:iam:org:projects:roles" \
            | jq -er .access_token)
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"
      - name: Target the earlier version
        env:
          API: ${{ vars.CORE_API_URL }}
          TOKEN: ${{ steps.token.outputs.token }}
          PACKAGE: ${{ inputs.package }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          dir=${PACKAGE//_/-}  # the staged zip is named after the directory: ray_jobs -> jobs/ray-jobs-<sha256>.zip
          row=$(curl -fsS -X POST "${API}/v1/admin/job-packages/${PACKAGE}/target" \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
            -d "{\"s3_key\": \"jobs/${dir}-${SHA256}.zip\"}")
          echo "$row" | jq -c '{name, sha256, status, smoke_status}'
          [ "$(echo "$row" | jq -r .status)" = stable ] || { echo "::error::${PACKAGE} ${SHA256} is not the target: its smoke has not passed, or it is smoked again"; exit 1; }
