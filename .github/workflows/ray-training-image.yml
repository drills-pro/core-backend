name: Build the Ray trainer image

# The cluster's Ray image (cu128) plus the ray_training dependencies (ray-training/Dockerfile), for the GPU worker group. Not deployed from here: put the digest
# in k8s apps/ray/app/raycluster.yaml by hand, because that restarts the Ray head and the GPU worker.
on:
  push:
    paths:
      - "ray-training/Dockerfile"
      - "ray-training/pyproject.toml"
      - ".github/workflows/ray-training-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./ray-training
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/ray-training:${{ steps.sha.outputs.tag }}
          cache-from: type=gha,scope=ray-training
          cache-to: type=gha,mode=max,scope=ray-training
