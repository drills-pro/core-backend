name: Test console image

on:
  push:
    paths:
      - "test-console/**"
      - ".github/workflows/test-console-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/drills-pro/core-backend/test-console

jobs:
  # `pnpm build` (typecheck included) runs inside the Dockerfile, so a type error never becomes an image.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ./test-console
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Public values, inlined into the bundle by Vite (a PKCE client id is not a secret).
          build-args: |
            VITE_ZITADEL_CLIENT_ID=${{ vars.TEST_CONSOLE_ZITADEL_CLIENT_ID }}
            VITE_ZITADEL_ISSUER=https://auth.drills.pro
            VITE_API_URL=https://api.drills.pro
          cache-from: type=gha,scope=test-console
          cache-to: type=gha,mode=max,scope=test-console

  # Needs apps/frontend-test in the k8s repo (drafts in test-console/deploy/k8s).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: drills-pro/k8s/.github/workflows/bump-image.yml@main
    with:
      app: frontend-test
      image: ghcr.io/drills-pro/core-backend/test-console
      digest: ${{ needs.build.outputs.digest }}
      tag: ${{ github.sha }}
    secrets:
      repo-token: ${{ secrets.K8S_REPO_PAT }}
