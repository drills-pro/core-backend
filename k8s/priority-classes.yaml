# NFR2 (07-compute-ray-k8s.md): no tenant's training job may preempt
# another tenant's serving replica. Priority classes + separate node pools
# (see raycluster.yaml nodeSelectors) enforce this.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: serving-priority
value: 1000000
globalDefault: false
description: Ray Serve replicas — must not be preempted by training.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: training-priority
value: 100000
globalDefault: false
description: Ray Train/Tune jobs — spot-preferred, preemptible by nothing serving-critical.
