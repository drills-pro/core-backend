# req/07-compute-ray-k8s.md: KubeRay-managed cluster with the doc's three
# node pools. head runs on the system pool; two worker groups map to the
# training and serving pools with distinct priority classes (NFR2).
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: platform-ray
  labels:
    app: platform
spec:
  rayVersion: "2.49.2"
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
    template:
      spec:
        nodeSelector: { node-pool: system }
        containers:
          - name: ray-head
            image: rayproject/ray:2.49.2
            ports:
              - containerPort: 6379
                name: gcs
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
            resources:
              requests: { cpu: "500m", memory: "1Gi" }
              limits: { cpu: "1", memory: "2Gi" }
  workerGroupSpecs:
    - groupName: training
      replicas: 0
      minReplicas: 0
      maxReplicas: 5
      # FR2: spot-preferred + scale-to-zero when idle.
      rayStartParams: {}
      template:
        spec:
          nodeSelector: { node-pool: training }
          priorityClassName: training-priority
          containers:
            - name: ray-worker
              image: rayproject/ray:2.49.2
              resources:
                requests: { cpu: "500m", memory: "1Gi" }
                limits: { cpu: "1", memory: "2Gi" }
    - groupName: serving
      replicas: 1
      minReplicas: 1
      maxReplicas: 10
      rayStartParams: {}
      template:
        spec:
          nodeSelector: { node-pool: serving }
          priorityClassName: serving-priority
          containers:
            - name: ray-worker
              image: rayproject/ray:2.49.2
              resources:
                requests: { cpu: "500m", memory: "1Gi" }
                limits: { cpu: "1", memory: "2Gi" }
