# Local stand-in for EKS/GKE (req/07-compute-ray-k8s.md "Cluster shape").
# Three node pools mirror the doc's table: system / training / serving.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    labels: { node-pool: system }
  - role: worker
    labels: { node-pool: training }
  - role: worker
    labels: { node-pool: serving }
