# req/08 FR2 "GPU node pool exhaustion" — proof the quota signal is real,
# not fabricated: this pod requests a GPU resource. It stays Pending
# forever in this environment (no device plugin registers real GPUs, so
# the scheduler can never satisfy the request) — that Pending state and
# the ResourceQuota's "used" counter incrementing are both real Kubernetes
# behavior, admission-tracked regardless of whether hardware exists to
# actually run it. Apply/delete this to watch kube_resourcequota's "used"
# value for requests.nvidia.com/gpu move between 0 and 1 live.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-training-example
  namespace: tenant-11111111-1111-1111-1111-111111111111
  labels: { tenant_id: "11111111-1111-1111-1111-111111111111", job_type: training }
spec:
  priorityClassName: training-priority
  containers:
    - name: trainer
      image: rayproject/ray:2.49.2
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
          nvidia.com/gpu: "1"
        limits:
          nvidia.com/gpu: "1"
