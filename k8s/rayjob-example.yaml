# req/07 FR1: tenant_id/project_id labels propagated onto the underlying
# K8s pods (required for OpenCost allocation, req/08) — the labels here
# land on the submitter job pod AND (via KubeRay's RayJob->RayCluster
# templating) can be templated per-tenant if core-api generates this
# manifest instead of using Ray's HTTP Job API (see app/ray_client.py,
# which currently targets the docker-compose single-node cluster).
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: example-training-job
  labels:
    tenant_id: "11111111-1111-1111-1111-111111111111"
    project_id: "replace-with-real-project-id"
    job_type: training
spec:
  entrypoint: "python -c \"import time; time.sleep(2); print('metric:accuracy=0.87')\""
  shutdownAfterJobFinishes: true
  rayClusterSpec:
    rayVersion: "2.49.2"
    headGroupSpec:
      rayStartParams: { dashboard-host: "0.0.0.0" }
      template:
        metadata:
          labels: { tenant_id: "11111111-1111-1111-1111-111111111111", job_type: training }
        spec:
          nodeSelector: { node-pool: system }
          containers:
            - name: ray-head
              image: rayproject/ray:2.49.2
              resources:
                requests: { cpu: "250m", memory: "512Mi" }
    workerGroupSpecs:
      - groupName: training
        replicas: 1
        minReplicas: 1
        maxReplicas: 1
        rayStartParams: {}
        template:
          metadata:
            labels: { tenant_id: "11111111-1111-1111-1111-111111111111", job_type: training }
          spec:
            nodeSelector: { node-pool: training }
            priorityClassName: training-priority
            containers:
              - name: ray-worker
                image: rayproject/ray:2.49.2
                resources:
                  requests: { cpu: "250m", memory: "512Mi" }
