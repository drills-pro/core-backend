# A separate, real Postgres instance for Zitadel — CloudNativePG, not the
# shared docker-compose dev postgres (req/02's own NFR1 just requires
# "Postgres already in the data layer", not this specific one; separating
# it matches how a real platform would isolate the identity provider's
# data store from the app database).
# Credentials are pinned here rather than left to CloudNativePG's random
# generation, so a freshly created cluster matches the ZITADEL_DATABASE_*
# values already committed in docker-compose.yml. Without this, every
# `kubectl apply` of this file produces new random passwords that the
# compose stack can't know — the local dev stack is not reproducible.
# Same threat model as the other plaintext dev credentials in
# docker-compose.yml: laptop-only, not a deployment secret.
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-pg-app
type: kubernetes.io/basic-auth
stringData:
  username: zitadel
  password: "B2uCkpIyblI1i0vWBI5SYLFctq6K9LXICDrvvg2BX0MahTyuWK7h5FJdgWWqnAdm"
---
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-pg-superuser
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: "F4DPM53tfvI2BZ25zzHrLmuSaiYd5DeSMJ9Ghn14lfwGdaeQHePlKJWHQWAOqwfn"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-pg
spec:
  instances: 1
  enableSuperuserAccess: true
  superuserSecret:
    name: zitadel-pg-superuser
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: zitadel
      owner: zitadel
      secret:
        name: zitadel-pg-app
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel-pg-nodeport
spec:
  type: NodePort
  selector:
    cnpg.io/cluster: zitadel-pg
    role: primary
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432
