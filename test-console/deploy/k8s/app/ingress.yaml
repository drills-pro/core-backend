apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-test
  namespace: platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts: [test.drills.pro]
    secretName: frontend-test-tls
  rules:
  - host: test.drills.pro
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-test
            port: {number: 80}
