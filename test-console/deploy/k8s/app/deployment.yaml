apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-test
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend-test}
  template:
    metadata:
      labels: {app: frontend-test}
    spec:
      serviceAccountName: app-frontend-test
      containers:
      - name: frontend-test
        image: ghcr.io/drills-pro/core-backend/test-console:latest
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet: {path: /, port: 3000}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /, port: 3000}
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {cpu: 100m, memory: 128Mi}
      imagePullSecrets:
        - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-test
  namespace: platform
spec:
  selector: {app: frontend-test}
  ports:
  - port: 80
    targetPort: 3000
