[project]
name = "ray-jobs"
version = "0.1.0"
description = "Ray jobs of the drills.pro data plane: one entrypoint per job type (python -m ray_jobs.entrypoints.<name>)"
requires-python = ">=3.11"  # the Ray image runs 3.11
dependencies = [
    "boto3>=1.26",
    "pyarrow>=15",
    "pillow>=10",
    "numpy",  # predictor-cpu (ray_serving) runs on this pool
    "onnxruntime>=1.18",
    "tokenizers",
    "onnx>=1.16",  # the ray_serving smoke job builds a tiny model with it
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ray_jobs"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
