# Everything specific to the cluster. Service names come from the k8s repo (apps/backend/, apps/mlflow/,
# apps/ray/, infra/monitoring/); when they change there, change them here. Secrets are never here: they
# are the files named under `secrets:` in base.yaml. auth.dev_headers must stay unset (prod refuses it).
pg:
  host: pg-backend-rw.platform.svc.cluster.local   # per-app CNPG cluster (k8s apps/backend/cluster.yaml)
  database: backend
zitadel:
  issuer: https://auth.drills.pro
  internal_url: http://zitadel.zitadel.svc.cluster.local:8080   # k8s infra/zitadel; Host header carries the issuer's name
  project_id: "395337035725930916"   # the Zitadel project the SPA and API share; tokens must carry it in aud
ray:
  dashboard: http://ray-head-svc.ray.svc.cluster.local:8265
mlflow:
  url: http://mlflow.platform.svc.cluster.local:5000
observability:
  otlp_endpoint: http://otel-gateway.monitoring.svc.cluster.local:4317
data_plane:
  staging_bucket: drills-pro-staging     # its own GCS bucket, same project and S3-interop store as lakeFS (k8s bootstrap/19)
  lakefs_blockstore_bucket: drills-pro   # lakeFS keeps repositories here;
  lakefs_blockstore_scheme: gs   # lakeFS uses its native GCS adapter: its S3 client is refused by the GCS interop API (SignatureDoesNotMatch)
public:
  staging_endpoint: https://storage.googleapis.com   # browsers PUT uploads here (presigned, needs bucket CORS)
  # lakefs_endpoint: unset until lakeFS's S3 gateway has a host without the oauth2-proxy in front (version URLs are presigned against it)
