# core-api running inside docker-compose: base.yaml already uses the compose service names.
# Secret files come from ./.local/secrets mounted at /var/app-secret/app-backend (docker-compose.yml).
auth:
  dev_headers: true
pg:
  host: postgres
  database: core
secrets:
  db: /var/app-secret/app-backend/db.json
  lakefs: /var/app-secret/app-backend/lakefs.json
  staging: /var/app-secret/app-backend/staging.json
  ingest: /var/app-secret/app-backend/ingest.json
  zitadel: /var/app-secret/app-backend/zitadel.json
ray:
  dashboard: http://ray-head:8265
mlflow:
  url: http://mlflow:5000
observability:
  otlp_endpoint: http://lgtm:4317
