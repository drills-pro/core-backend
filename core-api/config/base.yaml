# Defaults for every environment. Non-secret only: secrets are referenced by the path of the JSON
# file that holds them (secrets: below), never by value. Per-environment files override this one;
# CORE_<SECTION>__<KEY> environment variables override both (e.g. CORE_PG__HOST=...).
# Service hostnames are deliberately absent here: each environment must set pg.host,
# ray.dashboard, mlflow.url and observability.otlp_endpoint (prod via the deploy ConfigMap), so a
# missing one fails at startup instead of silently pointing at a compose name.
pg:
  port: 5432
  database: backend
  pool_min: 2
  pool_max: 20
  command_timeout: 30

zitadel:
  issuer: http://zitadel.monorepo.orb.local:8080
  internal_url: ""           # prod fetches signing keys in-cluster, not through Cloudflare
  project_id: ""             # tokens must carry it in aud; prod.yaml sets it, locally CORE_ZITADEL__PROJECT_ID

auth:
  dev_headers: false         # X-Tenant-Id / X-User-Id / X-Admin-User stand in for a token

ray:
  max_concurrent_training_runs: 3

compute:                     # app/integrations/compute.py
  backend: ray_dashboard     # ray_dashboard | rayjob
  rayjob:
    namespace: ray
    cluster_name: ""         # empty: one ephemeral cluster per job, from cluster_spec
    cluster_spec: {}
    shutdown_after_finish: true
    ttl_after_finished_seconds: 86400

background:
  pollers_in_api: true       # false when the worker Deployment runs them (docs/runtime-contract.md)

data_plane:
  staging_bucket: drills-staging
  lakefs_blockstore_bucket: lakefs-data
  lakefs_blockstore_scheme: s3
  presign_ttl_seconds: 3600
  commit_timeout_seconds: 600

dataset_limits:
  upload_max_bytes: 2147483648          # 2 GiB
  extracted_max_bytes: 10737418240      # 10 GiB
  extracted_max_ratio: 100
  max_files: 100000
  max_archive_depth: 8
  max_path_length: 255
  image_max_dimension: 8192
  image_max_bytes: 26214400             # 25 MiB
  csv_min_rows: 10
  csv_max_rows: 5000000
  csv_max_columns: 1000
  hf_max_repo_bytes: 10737418240        # 10 GiB
  job_timeout_seconds: 3600
  ray_job_cpus: 2
  ray_job_memory_bytes: 8589934592      # 8 GiB
  max_active_imports_per_tenant: 3

training:                    # app/modules/user/training; a task's cpu and memory are per preset (task_presets)
  driver_cpus: 1
  max_runtime_seconds: 14400            # 4 h
  events_base_url: ""                   # origin the trainer posts progress to; "" = off (compose and local set it, prod needs the k8s side first)

serving:                     # app/integrations/serve_client.py: the two shared predictor apps
  max_models_per_replica: 8
  max_ongoing_requests: 8
  autoscale_target_ongoing_requests: 2   # half of max_ongoing_requests: scale out before a replica's queue fills
  autoscale_upscale_delay_seconds: 10
  autoscale_downscale_delay_seconds: 300
  health_check_period_seconds: 10
  health_check_timeout_seconds: 30
  graceful_shutdown_timeout_seconds: 30
  url: ""                              # prod: the ClusterIP Service of the Serve proxies; empty = the head's address (dev)
  connect_retries: 2
  request_timeout_seconds: 60          # includes a cold load of the model
  max_body_bytes: 10485760             # 10 MiB: a base64 image
  max_inflight_per_deployment: 8       # per core-api replica, not global
  max_active_deployments_per_tenant: 3 # fallback for a tier without a plan_limits row
  predict_calls_retention_days: 30
  test_calls_retention_days: 7         # "try it" requests and responses older than this are purged
  package_url_ttl_seconds: 604800      # 7 days, S3's maximum; the apps are re-declared (new URL) after half of it
  apps:
    cpu: {min_replicas: 2, max_replicas: 4, num_cpus: 1, num_gpus: 0, resources: {cpu_pool: 0.01}}   # on the CPU pool, two replicas so one can fail
    gpu: {min_replicas: 0, max_replicas: 2, num_cpus: 1, num_gpus: 1, resources: {}}

predict:                     # app/modules/user/deployments: stored predictions (background mode, Idempotency-Key)
  worker_concurrency: 8                # background predictions one process sends to Serve at once
  max_attempts: 3
  lease_seconds: 90                    # longer than serving.request_timeout_seconds, or a live call would be taken back
  background_retention_days: 7
  sync_retention_hours: 24
  in_progress_wait_seconds: 10
  inline_max_bytes: 262144             # 256 KB: a larger input or output goes to the staging bucket (predictions/<tenant>/<project>/<id>/)
  legacy_sunset: 2026-12-31T23:59:59Z  # Sunset header of the old POST /v1/predict/{deployment_id} (planning/24, migration phase 1)

observability:

public:                      # browser-facing, not the in-network names
  lakefs_endpoint: http://localhost:8000
  staging_endpoint: http://localhost:9000

secrets:                     # paths of JSON files, mounted into the pod (Vault Agent Injector in prod)
  db: /vault/secrets/db      # Postgres creds from Vault's database engine (k8s apps/_components/vault-db-creds)
  lakefs: /var/app-secret/app-backend/lakefs
  staging: /var/app-secret/app-backend/staging
  ingest: /var/app-secret/app-backend/ingest
  zitadel: /var/app-secret/app-backend/zitadel
  webhooks: /var/app-secret/app-backend/webhooks   # {"signing_key"}: optional, webhook delivery is off without it
