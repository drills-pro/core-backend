# core-api run on the host (uv run uvicorn ...) against `docker compose up` services.
# 127.0.0.1, not localhost: localhost tries ::1 first, and OrbStack resets IPv6 for containers
# that listen on IPv4 only (ray, mlflow).
pg:
  host: 127.0.0.1
  database: core
zitadel:
  issuer: http://zitadel.monorepo.orb.local:8080
auth:
  dev_headers: true
ray:
  dashboard: http://127.0.0.1:8265
mlflow:
  url: http://127.0.0.1:5001
observability:
  otlp_endpoint: http://127.0.0.1:4317
# Relative paths resolve against core-api/. These are bootstrap.sh's host copies of .local/secrets/,
# with compose hostnames rewritten to OrbStack's <service>.<project>.orb.local (needs OrbStack).
secrets:
  db: ../.local/secrets-host/db.json
  lakefs: ../.local/secrets-host/lakefs.json
  labelstudio: ../.local/secrets-host/labelstudio.json
  zitadel: ../.local/secrets-host/zitadel.json
  zitadel_oidc: ../.local/secrets-host/zitadel-oidc.json
