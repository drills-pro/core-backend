[project]
name = "core-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "boto3>=1.34",
    "asyncpg>=0.29",
    "pyjwt[crypto]>=2.8",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "pyarrow>=15",  # preview reads the head of index.parquet / data.parquet
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "cryptography>=42",
    "ruff>=0.17.3",
    "coverage>=7",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
pythonpath = [".", "../ray-jobs", "../ray-training", "../ray-serving"]  # ray_jobs, ray_core, ray_serving: the contract tests import the job packages (ray_core without torch)
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# The CI gate (tests.yml runs pytest with --cov): a pull request that drops the total below this fails. Baseline 91% on
# 2026-11-10; raise the number when coverage rises, never lower it to get a change through.
fail_under = 90
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
