[project]
name = "ray-training"
version = "0.1.0"
description = "Ray training jobs of the drills.pro trainer: image classification and object detection (python -m ray_training.entrypoints.train)"
requires-python = ">=3.11"  # the Ray image runs 3.11
dependencies = [
    "torch>=2.7",
    "torchvision",
    "transformers>=4.50",
    "timm>=1.0",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript",
    "numpy",
    "scipy",  # RT-DETR Hungarian matcher
    "boto3>=1.26",
    "pyarrow>=15",
    "pillow>=10",
]

[dependency-groups]
# ray is in the cluster image (2.60.0, not on PyPI yet; 2.59 is the closest for local tests), so dev-only here
dev = ["pytest>=8.0", "jsonschema>=4", "ray>=2.59,<2.61"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ray_training"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning", "ignore::torch.jit.TracerWarning"]
markers = ["online: needs a Hugging Face download; skipped when offline"]
