[project]
name = "ray-training"
version = "0.1.0"
description = "The trainer image of drills.pro (these dependencies) and ray_core, the training contract task bundles run on with Ray Train (python -m ray_core.entrypoints.train)"
requires-python = ">=3.11"  # the Ray image runs 3.11
dependencies = [
    "torch>=2.7,<2.12",  # the cu128 wheel index ends at 2.11; a newer PyPI wheel targets another CUDA
    "torchvision",
    "transformers>=4.50",
    "timm>=1.0",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript",
    "numpy",
    "scipy",  # RT-DETR Hungarian matcher
    "boto3>=1.26",
    "pyarrow>=15",
    "pillow>=10",
    "xgboost>=2.1",  # the tabular bundle (task-bundles/tasks/tabular-classification); cheap, so in the image ahead of need (planning 25)
    "onnxmltools>=1.13",  # its ONNX export
]

[dependency-groups]
# ray is in the cluster image (2.60.0, not on PyPI yet; 2.59 is the closest for local tests), so dev-only here
dev = ["pytest>=8.0", "jsonschema>=4", "ray[train]>=2.59,<2.61"]  # [train] is what makes ray.train importable (pandas, fsspec, ...)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ray_core"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning", "ignore::torch.jit.TracerWarning"]
markers = ["online: needs a Hugging Face download; skipped when offline"]
