- id: TRN-26
  area: training
  title: Deploy gate with acknowledge_risk, model card, near-duplicate warning
  source: planning/06 Quality gates
  status: built
  weight: 2
  old: F07
  code: ["GET /v1/projects/{project_id}/training-runs/{run_id}/card", core-api/app/modules/user/deployments/lineage.py, core-api/app/modules/user/deployments/service.py, core-api/app/modules/user/deployments/routes.py, core-api/app/modules/user/training/readers.py, core-api/migrations/20261111224403_deployments_risk_acknowledged.sql]
  tests:
    - core-api/tests/modules/user/deployments/test_deployment_service.py::test_a_run_without_a_test_dataset_needs_acknowledge_risk_and_the_answer_is_recorded
    - core-api/tests/modules/user/deployments/test_deployments.py::test_the_model_card_carries_the_scores_the_dataset_version_and_the_test_split_flag
    - core-api/tests/modules/user/deployments/test_deployments.py::test_the_card_of_an_unknown_run_is_404
  note: A run with no test dataset, or a score under the task floor (METRIC_FLOORS in deployments/constants.py), is 409 deploy_risk_unacknowledged until acknowledge_risk=true, which is recorded on the deployment. GET .../training-runs/{run_id}/card returns task, preset, the pinned base model, scores, dataset version and the test-split flag. The card also carries the licence an admin recorded on the preset. near_duplicates (DAT-21) shows how many held-out images have a near twin in the training set.
- id: TRN-27
  area: training
  title: Base model pinned by commit, copied into the spec
  source: planning/17 Admission policy; planning/06 Job spec rules
  status: built
  old: F19
  code: [core-api/app/core/presets.py, core-api/app/integrations/hub.py, core-api/app/modules/admin/presets/routes.py, core-api/app/modules/user/training/train_spec.py, ray-training/ray_core/spec.py]
  note: Writing a preset reads the Hub model-info at the pinned commit and refuses a model with no safetensors weights, a config with auto_map, a licence outside training.model_license_allowlist, or files over training.model_max_bytes; the Hub licence is stored on the preset. training.hub_url empty skips the check.
  tests:
  - core-api/tests/integrations/test_hub.py::test_each_rule_refuses_on_its_own
  - core-api/tests/modules/admin/test_presets.py::test_put_refuses_a_model_the_policy_rejects_and_writes_nothing
  - core-api/tests/core/test_presets.py::test_a_bad_preset_is_refused
  - core-api/tests/modules/user/training/test_training.py::test_create_builds_the_spec_stores_it_and_submits_it
- id: TRN-28
  area: training
  title: Base model served from the platform mirror, never the Hub at run time; licence recorded
  source: planning/17 Catalog; planning/06 Job spec rules
  status: deferred
  weight: 2
  old: F20
  code: ["GET /v1/catalog/models", core-api/app/modules/user/catalog/service.py, core-api/app/core/task_catalog.py, core-api/app/core/presets.py, core-api/migrations/20261111231253_task_presets_license.sql]
  tests:
    - core-api/tests/modules/user/catalog/test_catalog.py::test_lists_each_base_model_once_with_its_tasks_and_presets
    - core-api/tests/modules/admin/test_presets.py::test_put_writes_the_row_as_the_actor_and_returns_it
    - core-api/tests/modules/user/deployments/test_deployments.py::test_the_model_card_carries_the_scores_the_dataset_version_and_the_test_split_flag
  note: An admin records the base model's SPDX licence on the preset (task_presets.base_model_license); it rides in the run spec's base_model, shows on the model card and is written to model.json. The trainers load weights with use_safetensors=True so a pickled checkpoint is refused.
  gap: The platform mirror is deferred by decision 2026-11-12 until a bucket and mirroring job exist in the k8s repo; the trainer still reads the Hub at a pinned revision.
