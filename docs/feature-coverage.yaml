# Feature coverage manifest: which designed capabilities are built, and which are tested.
# Checked by core-api/tests/architecture/test_feature_coverage.py; rendered by scripts/feature-coverage-report.py
# into docs/feature-coverage.md. Written 2026-11-10 from the code at that date, not from the older audit.
#
# Fields
#   id       AREA-NN, stable
#   area     training | registry | deployment | serving | predict | jobs | datasets
#   title    the capability, one line
#   source   design doc and section (planning/NN-... or core-backend docs/...)
#   status   built | partial | missing | deferred   (deferred = the design itself schedules it later)
#   weight   importance of a gap for ranking: 3 blocks the product path or isolation, 2 real gap, 1 polish
#   old      feature id of the 2026-11-05 audit (F06..F20) when it had one
#   code     files, or "METHOD /path" routes of the app (a route must exist in the OpenAPI)
#   tests    files, or "file::test_function" (the function must exist in the file)
#   gap      one line for partial, missing and deferred
#   note     anything else worth knowing, including what could not be verified
#
# Every in-scope route of the app (training, models, deployments, predict, datasets, api-keys, job packages,
# task types, plan limits) must appear in some entry's code list, so a new route forces a new row here.

entries:
