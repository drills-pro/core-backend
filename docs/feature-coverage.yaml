- id: TRN-24
  area: training
  title: GPU memory sharing - declared vram_gb, per-process memory fraction, admission by sum of fractions
  source: planning/17 GPU sharing
  status: built
  weight: 1
  old: F07
  code: [ray-training/ray_core/result.py, ray-training/ray_core/loop.py, ray-training/ray_core/spec.py, core-api/app/core/presets.py, core-api/app/integrations/job_spec.py, core-api/migrations/20261111230743_task_presets_vram.sql]
  tests:
    - ray-training/tests/test_gpu_share.py::test_only_a_fraction_on_a_cuda_machine_is_capped
    - ray-training/tests/test_gpu_share.py::test_a_declared_vram_caps_the_job_at_the_smaller_of_it_and_its_share
  note: A job holding a fraction of a GPU caps its memory at that fraction (set_per_process_memory_fraction); a preset may also declare vram_gb (task_presets.vram_gb, carried in resources.vram_gb), and the cap is the smaller of the two. Ray admits by the sum of the fractional GPU counts.
